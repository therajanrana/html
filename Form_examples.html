<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <form>
       <fieldset>

        <legend>HTML Dummy Form </legend>
        
        <label for="datepicker">Choose date</label>
        <input type="date" id="datepicker">
        <br>
        <br>

        <label for="selector1">Choose dish</label>
        <br>
        <br>

        <select name="dishes" id="selector1">

        <option value="maggie">Maggie</option>
        <option value="kurkure">Kurkure</option>
        <option value="chips">Chips</option>
        
        </select>

        <button type="submit">Submit</button>
        <br>
        <br>

        <textarea name="textarea1" id="textarea1" cols="30" rows="15" placeholder="Give your feedback......"></textarea>
    </fieldset>
    </form>

    <form>
        <br><br><br>

        <fieldset>

        <label for="textarea">Text Area</label>
        <input type="text" id="textarea">
        <br>
        <br>

        <label for="button">Button</label>
        <input type="submit" id="button" value="Subscribe">
        <br>
        <br>

        <h1>Select Gender :</h1>
        <label for="radio1">Male:</label>
        <input type="radio" name="radio1" id="radio1" value="Male">
        <br>
        <br>

        <label for="radio2">Female</label>
        <input type="radio" name="radio2" id="radio2" value="Female">
        <br>
        <br>

        <label for="radio3">Other</label>
        <input type="radio" name="radio3" id="radio3" value="Other">
        <br>
        <br>

        <h2>Select language :</h2>

        <label for="checkbox1">English</label>
        <input type="checkbox" name="checkbox1" id="checkbox1">

        <label for="checkbox2">Hindi</label>
        <input type="checkbox" name="checkbox2" id="checkbox2">
        <br>
        <br>

        <label for="file">Upload</label>
        <input type="file" name="file1" id="file1">
        <br>
        <br>
        </fieldset>
        <br>
        <br>

        <fieldset>

        <label for="username">Enter username :</label>
        <input type="text" name="username1" id="username">
        <br>
        <br>

        <label for="password1">Password :</label>
        <input type="password" name="password1" id="password1" placeholder="Enter Password">
        <br>
        <br>
         <button type="submit" style="margin-left: 80px;" >Log in</button>

        </fieldset>
    </form>
</body>
</html>
