<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Registration Form</title>
</head>
<body>
    <fieldset>
        <form>
            <h1>Student Registrationn Form</h1>

            <label for="rollno">Roll No. :</label>
            <input type="text" name="rollno1" id="rollno">
            <br>
            <br>

            <label for="studentname">Full Name :</label>
            <input type="text" name="studentname1" id="studentname">
            <br>
            <br>

            <label for="fathername">Father's Name :</label>
            <input type="text" name="fathername1" id="fathername">
            <br>
            <br>
            <label for="date">Date of birth :</label>
            <input type="date" name="date1" id="date">
            <br>
            <br> 

            <label for="course">Course :</label>
            <input type="text" name="course1" id="course">
            <br>
            
            <p>
                Gender :
            <label for="male">Male</label>
            <input type="checkbox" name="male1" id="male">

            <label for="female">Female</label>
            <input type="checkbox" name="female1" id="female1">

            </p>

            <p>
                Department :
                <label for="cse">CSE</label>
                <input type="checkbox" name="cse1" id="cse">

                <label for="it">IT</label>
                <input type="checkbox" name="it1" id="it">

                <label for="civil">Civil</label>
                <input type="checkbox" name="civil1" id="civil">

                <label for="ece">ECE</label>
                <input type="checkbox" name="ece1" id="ece">

                <label for="mech">Mech</label>
                <input type="checkbox" name="mech1" id="mech">
            </p>

            <label for="email">Email id :</label>
            <input type="text" name="email1" id="email">
            <br>
            <br>
            <label for="college">College :</label>
            <input type="text" name="college1" id="college">
            <br>

            <p>
                Year :

            <label for="year">1st</label>
            <input type="checkbox" name="year1" id="year">

            <label for="year">2nd</label>
            <input type="checkbox" name="year2" id="year">

            <label for="year">3rd</label>
            <input type="checkbox" name="year3" id="year">

            <label for="year">4th</label>
            <input type="checkbox" name="year4" id="year">
            </p>

            <label for="file">Student's Photo :</label>
            <input type="file" name="file1" id="file">
            <br>
            <br>
            
            <label for="city">City :</label>
            <input type="text" name="city1" id="city">
            <br>
            <br>
            <label for="address">Address :</label>
            <textarea name="address" id="address" rows="3" cols="35"></textarea>

        </form>
    </fieldset>
</body>
</html>
