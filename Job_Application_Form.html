<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1>Job Application</h1>
    <form>

        <label for="name">Name :</label>
        <input type="text" name="name1" id="name">
        <br>
        <br>
        <label for="email">Email id :</label>
        <input type="text" name="email1" id="email">
        <br>
        <br>
        <label for="phone">Phone:</label>
        <input type="text" name="phone1" id="phone">
        <br>
        <br>
        <label for="file">Resume :</label>
        <input type="file" name="file1" id="file">
        <br>
        <br>
        <label for="counter">Year :</label>
        <input type="number" name="counter" id="counter" min="0" max="30">
        <br>
        <br>
                <label for="html">HTML</label>
                <input type="checkbox" name="html1" id="html">

                <label for="css">CSS</label>
                <input type="checkbox" name="css1" id="css">

                <label for="java">Java</label>
                <input type="checkbox" name="java1" id="java">
                <br>
                <br>
                <label for="highesteducation">Highest Education :</label>
                <select name="" id="">
                    <option value="High School">High School</option>
                    <option value="Intermediate">Intermediate</option>
                    <option value="Graduation">Graduation</option>
                </select>
                <br>
                <br>
                <p>
                    Availability :
                <label for="fulltime">Full Time</label>
                <input type="checkbox" name="fulltime1" id="fulltime">

                <label for="parttime">Part time </label>
                <input type="checkbox" name="parttime1" id="parttime">
                <br>
                <br>
                <label for="aditionalcomment">Additional Comment :</label>
                <textarea name="aditionalcomment1" id="aditionalcomment" rows="5" cols="40"></textarea>

                </p>
    </form>
    
</body>
</html>
